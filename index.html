<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Online Paint Drawer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .error-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            border: 1px solid #e3e8ee;
        }

        h1 {
            font-size: 72px;
            color: #635bff;
            margin-bottom: 10px;
            line-height: 1;
        }

        h2 {
            color: #1a1f36;
            margin-bottom: 16px;
            font-size: 24px;
        }

        p {
            color: #4f566b;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #635bff;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.15s ease;
            box-shadow: 0 2px 4px rgba(99, 91, 255, 0.2);
        }

        .btn:hover {
            background-color: #4b45cc;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>404</h1>
        <h2>Canvas Not Found!</h2>
        <p>The page you are looking for might have been moved, deleted, or never existed in the first place.</p>
        <a href="index.html" class="btn">🏠 Return to Painter</a>
    </div>

</body>
</html>
